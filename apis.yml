aid: cowboy-space
name: Cowboy Space
description: 'Cowboy Space Corporation builds space-based infrastructure for artificial-intelligence
  computing. Its flagship program, Stampede, is a constellation of solar-powered GPU data centers in
  Low Earth Orbit that integrate the rocket''s upper stage with the satellite to form a megawatt-class
  data center with active thermal management and integrated compute. The company positions orbital
  compute as an alternative to terrestrial data centers, whose grid-connection lead times in major US
  markets can run five to seven years or more, arguing that Earth''s energy grid cannot keep pace with
  AI demand. Cowboy Space is an early-stage aerospace and AI-infrastructure startup backed by Index
  Ventures and Ribbit Capital; it currently publishes a corporate and careers presence with no public
  developer API.'
